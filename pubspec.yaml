name: iris
description: A lightweight video player
publish_to: none
version: 2.0.11+2804

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  file_picker: ^10.3.3
  flutter_breadcrumb: ^1.0.1
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^8.1.0
  flutter_zustand: ^0.0.5
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  provider: ^6.1.5
  webdav_client: ^1.2.2
  window_manager: ^0.5.1
  url_launcher: ^6.3.2
  scrollable_positioned_list: ^0.3.8
  google_fonts: ^6.3.1
  dynamic_color: ^1.8.1
  window_size: ^0.1.0
  uuid: ^4.5.1
  flutter_markdown: ^0.7.7+1
  http: ^1.5.0
  collection: ^1.19.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  disks_desktop: ^1.0.1
  android_x_storage: ^1.0.2
  permission_handler: ^12.0.1
  desktop_drop: ^0.6.1
  app_links: ^6.4.1
  device_info_plus: ^12.1.0
  saf_util: ^0.11.0
  screen_brightness: ^2.1.7
  flutter_volume_controller: ^1.3.3
  fvp: ^0.37.3
  video_player: ^2.10.0
  battery_plus: ^5.0.2
  wakelock_plus: ^1.4.0
  popover: ^0.3.1
  pure_ftp: ^0.7.5
  win32: ^5.14.0
  ffi: ^2.1.0
  open_filex: ^4.7.0
  image: ^4.5.4
  image_picker: ^1.2.3
  drives_windows:
    git:
      url: https://github.com/nini22P/drives_windows
      # Pinned: newer main requires win32 ^6 which conflicts with
      # package_info_plus (win32 ^5). Bump both together later.
      ref: 7bca74761a9bbc0b1c41b4f81186d1fc0aa9a079
  media_stream:
    git:
      url: https://github.com/nini22P/media_stream
      ref: main
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  drift_db_viewer: ^2.1.0
  synchronized: ^3.4.0
  sqflite: ^2.4.2
  crypto: ^3.0.2
  # AccumulatorSink: collects the SHA-256 digest of a streamed download without
  # holding the whole package in memory.
  convert: ^3.1.1
  cryptography: ^2.7.0
  logging: ^1.3.0
  network_info_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  dart_pubspec_licenses: ^3.0.9
  build_runner: ^2.10.5
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  msix: ^3.16.12
  drift_dev: ^2.30.1
  # Test-only: StoreLocator for the no-dispose StoreScope equivalent
  # (flutter_zustand re-exports create/Store only; StoreLocator is zustand API).
  zustand: ^0.0.5
  # Test-only: host-side sqlite3 loader override for drift widget tests
  # (see IRIS_SQLITE3_DLL in settings migration tests).
  sqlite3: ^2.4.0
  # Test-only: fake platform for the FVP open-generation test
  # (video_player's own platform interface, re-exported transitively).
  video_player_platform_interface: ^6.4.0
  # flutter_hooks_lint: ^1.4.0
  # custom_lint: ^0.8.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

msix_config:
  display_name: IRIS
  identity_name: 22P.IRISplayer
  publisher_display_name: 22P
  publisher: CN=9740B6B2-E777-4F52-8ECD-C4A577A73010
  # msix_version is intentionally omitted: the msix plugin derives it from the
  # pubspec `version` above (major.minor.patch.0), so it can never drift.
  logo_path: assets/images/logo.png
  trim_logo: false
  languages: en-us, zh-cn
  execution_alias: iris
  file_extension: .aac, .aiff, .alac, .amr, .ape, .caf, .cda, .dsd, .dts, .flac, .m4a, .midi, .mp3, .mpc, .oga, .ogg, .opus, .raw, .spx, .tak, .tta, .wav, .wma, .wv, .3gp, .amv, .asf, .avi, .divx, .dpx, .drc, .dv, .f4v, .flv, .h264, .h265, .hevc, .m2ts, .m4p, .m4v, .mkv, .mng, .mov, .mp2, .mp4, .mpe, .mpeg, .mpg, .mpv, .mts, .mxf, .nsv, .ogv, .qt, .rm, .rmvb, .ts, .vob, .webm, .wmv, .yuv