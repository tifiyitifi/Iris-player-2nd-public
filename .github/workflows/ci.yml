name: ci
on:
  push:
    branches: 
      - main
      - dev
    paths-ignore:
      - README.md
      - README_CN.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - README_CN.md
      - LICENSE

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: pure_ftp 0.7.5 relies on type promotion inside an inner
          # async closure, which Dart 3.13 (Flutter 3.47+) turned into an error.
          # Keep in sync with the stable release used for local development.
          flutter-version: '3.44.6'
      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          # Single source of truth is pubspec.yaml; strip the +build suffix so the
          # artifact name matches the release tag (vMAJOR.MINOR.PATCH).
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $v = $v.Split('+')[0]
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Generate code
        run: flutter pub get && flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Flutter application for Windows
        run: flutter build windows
      - name: Remove updater
        run: Remove-Item -Path build\windows\x64\runner\Release\iris-updater.bat -Force -ErrorAction SilentlyContinue
      - name: Copy update script for portable
        run: |
          Copy-Item -Path "windows\portable_update_by_zip.bat" -Destination "build\windows\x64\runner\Release\" -Force
          Copy-Item -Path "windows\portable_update_by_zip.ps1" -Destination "build\windows\x64\runner\Release\" -Force
      - name: Create portable ZIP archive
        run: |
          # Create a directory to hold the files
          mkdir IRIS
          # Copy the build output to the IRIS directory
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "IRIS" -Recurse -Force
          # Portable marker: presence of this file switches the app into
          # portable mode (all user data under .\userdata, next to the exe).
          New-Item -ItemType File -Path "IRIS\portable.flag" | Out-Null
          # Create a ZIP file, versioned so the asset name matches the release tag.
          Compress-Archive -Path "IRIS" -DestinationPath "IRIS-windows-v${{ steps.ver.outputs.value }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-windows-v${{ steps.ver.outputs.value }}.zip
          path: IRIS-windows-v${{ steps.ver.outputs.value }}.zip
      - name: Create installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.value }} inno.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-windows-installer-v${{ steps.ver.outputs.value }}.exe
          path: build\windows\x64\runner\Release\IRIS-windows-installer-v${{ steps.ver.outputs.value }}.exe
      - name: Clean up
        run: Remove-Item -Path build\windows\x64\runner\Release\ -Recurse -Force
      - name: Build store msix
        run: dart run msix:build --store true
      - name: Remove updater
        run: Remove-Item -Path build\windows\x64\runner\Release\iris-updater.bat -Force -ErrorAction SilentlyContinue; Remove-Item -Path build\windows\x64\runner\Release\portable_update_by_zip.bat -Force -ErrorAction SilentlyContinue; Remove-Item -Path build\windows\x64\runner\Release\portable_update_by_zip.ps1 -Force -ErrorAction SilentlyContinue
      - name: Pack store msix
        run: dart run msix:pack --store true --output-name IRIS-windows-store-v${{ steps.ver.outputs.value }}
      - name: Upload msix
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-windows-store-v${{ steps.ver.outputs.value }}.msix
          path: build\windows\x64\runner\Release\IRIS-windows-store-v${{ steps.ver.outputs.value }}.msix

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Free disk space
        # Three split APKs plus the universal APK need far more room than the
        # stock runner has (the native-libs merge used to die with
        # "No space left on device"); drop preinstalled toolchains we never use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true
          df -h /
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: pure_ftp 0.7.5 relies on type promotion inside an inner
          # async closure, which Dart 3.13 (Flutter 3.47+) turned into an error.
          # Keep in sync with the stable release used for local development.
          flutter-version: '3.44.6'
      - name: Read app version
        id: ver
        run: |
          # Single source of truth is pubspec.yaml; strip the +build suffix so the
          # artifact name matches the release tag (vMAJOR.MINOR.PATCH).
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | cut -d'+' -f1)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate code
        run: flutter pub get && flutter pub run build_runner build --delete-conflicting-outputs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Install Android NDK
        # The runner image does not ship ndk;27.0.12077973, which this project
        # requires, and Gradle's on-the-fly download is occasionally truncated
        # ("Error on ZipFile unknown archive"). Install it up front with retries.
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "sdkmanager: $SDKMANAGER"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;27.0.12077973"; then
              echo "NDK 27.0.12077973 installed"
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed; retrying"
            sleep 15
          done
          echo "::error::could not install ndk;27.0.12077973"
          exit 1
      - name: Decode and save keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
      - name: Save key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
      - name: Build Flutter application for Android
        # The project defines product flavors (nini22p/tifi7); a --flavor is
        # mandatory, and the published build is always tifi7.
        run: flutter build apk --flavor tifi7 --split-per-abi
      - name: Rename armeabi-v7a APK
        run: mv build/app/outputs/flutter-apk/app-armeabi-v7a-tifi7-release.apk IRIS-android-armeabi-v7a-v${{ steps.ver.outputs.value }}.apk
      - name: Rename arm64-v8a APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-tifi7-release.apk IRIS-android-arm64-v8a-v${{ steps.ver.outputs.value }}.apk
      - name: Rename x86_64 APK
        run: mv build/app/outputs/flutter-apk/app-x86_64-tifi7-release.apk IRIS-android-x86_64-v${{ steps.ver.outputs.value }}.apk
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-android-armeabi-v7a-v${{ steps.ver.outputs.value }}.apk
          path: IRIS-android-armeabi-v7a-v${{ steps.ver.outputs.value }}.apk
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-android-arm64-v8a-v${{ steps.ver.outputs.value }}.apk
          path: IRIS-android-arm64-v8a-v${{ steps.ver.outputs.value }}.apk
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-android-x86_64-v${{ steps.ver.outputs.value }}.apk
          path: IRIS-android-x86_64-v${{ steps.ver.outputs.value }}.apk
      - name: Build universal APK
        # Fat APK carrying every ABI; published so users who do not know their
        # phone's architecture have one safe download.
        run: flutter build apk --flavor tifi7
      - name: Rename universal APK
        run: mv build/app/outputs/flutter-apk/app-tifi7-release.apk IRIS-android-universal-v${{ steps.ver.outputs.value }}.apk
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-android-universal-v${{ steps.ver.outputs.value }}.apk
          path: IRIS-android-universal-v${{ steps.ver.outputs.value }}.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    # The default workflow token is read-only; creating the release and its tag
    # needs contents: write.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: yq
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version' 'pubspec.yaml'
      - name: Print version
        run: echo ${{ steps.yq.outputs.result }}
      - name: Prepare tag name
        id: tag_name
        run: |
          VERSION="${{ steps.yq.outputs.result }}"
          TAG_NAME="v${VERSION%%+*}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Check tag
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag: ${{ steps.tag_name.outputs.TAG_NAME }}
      - name: Eextract log
        if: steps.check-tag.outputs.exists == 'false'
        run: python extract_log.py ${{ steps.tag_name.outputs.TAG_NAME }}
      - name: Download artifact
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checksums
        if: steps.check-tag.outputs.exists == 'false'
        # Ships a SHA256SUMS.txt next to the packages so the in-app updater can
        # verify a download it did not fetch over a channel it controls. Written
        # in `sha256sum` format (digest, two spaces, file name).
        run: |
          cd artifacts
          sha256sum IRIS-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG_NAME }}
          body_path: CHANGELOG_${{ steps.tag_name.outputs.TAG_NAME }}.md
          draft: false
          prerelease: false
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/IRIS-windows-*.zip
            artifacts/IRIS-windows-installer-*.exe
            artifacts/IRIS-android-universal-v*.apk
            artifacts/IRIS-android-armeabi-v7a-v*.apk
            artifacts/IRIS-android-arm64-v8a-v*.apk
            artifacts/IRIS-android-x86_64-v*.apk
